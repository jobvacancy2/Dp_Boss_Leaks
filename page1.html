<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SwiftPay | Official Payment Gateway</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f0f4fd 0%, #e6ecf8 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .gateway-card {
      max-width: 460px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 20, 40, 0.15), 0 10px 25px rgba(0, 10, 30, 0.1);
      padding: 2rem 1.8rem 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .official-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .shield-icon {
      background: #0f3b5e;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 14px rgba(15, 59, 94, 0.25);
    }

    .brand-text {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.3px;
      color: #0b2b44;
      line-height: 1.2;
    }

    .brand-text span {
      font-weight: 500;
      color: #4a627a;
      font-size: 0.9rem;
      display: block;
    }

    .secure-badge {
      background: #e9f2fa;
      padding: 0.45rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #0f3b5e;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 0.3px;
    }

    .secure-badge i {
      color: #1e7b4b;
    }

    .dynamic-heading {
      background: #f8faff;
      border-radius: 1.2rem;
      padding: 1rem 1.2rem;
      margin: 1.2rem 0 1.5rem;
      border-left: 5px solid #0f3b5e;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }

    .dynamic-heading h2 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #0a1e32;
      margin: 0;
      line-height: 1.3;
      word-break: break-word;
    }

    .dynamic-heading .sub-msg {
      font-size: 0.9rem;
      color: #4b5c6e;
      margin-top: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* QR scanner display - medium size, well balanced */
    .scanner-display {
      background: #ffffff;
      border-radius: 1.8rem;
      padding: 1.5rem 1rem;
      margin: 1.8rem 0 1.8rem;
      border: 2px solid #e0e7f0;
      background: #f9fcff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* QR image: medium size (280px) – perfect balance */
    .qr-display-image {
      max-width: 280px;         /* medium size */
      width: 100%;
      height: auto;
      aspect-ratio: 1/1;        /* keeps square */
      border-radius: 1.2rem;
      box-shadow: 0 15px 25px rgba(0,0,0,0.1);
      display: block;
      object-fit: contain;
      background: white;
      padding: 0.6rem;
      border: 1px solid #eef3fa;
    }

    .scanner-label {
      font-size: 0.8rem;
      color: #6a7b8c;
      margin-top: 0.6rem;
      font-weight: 500;
    }

    .upi-id-box {
      background: #ffffff;
      border-radius: 1.2rem;
      padding: 0.9rem 1.2rem;
      margin: 1.2rem 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f2f6fd;
      border: 1px solid #dce3ef;
      font-weight: 500;
    }

    .upi-label {
      font-size: 0.8rem;
      color: #44566c;
      letter-spacing: 0.4px;
    }

    .upi-id {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0b2b44;
      letter-spacing: -0.2px;
      word-break: break-all;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-top: 1.5rem;
    }

    .btn {
      border: none;
      border-radius: 1.2rem;
      padding: 0.95rem 1.5rem;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 5px 12px rgba(0,0,0,0.04);
      border: 1px solid transparent;
      letter-spacing: 0.2px;
    }

    .btn-copy {
      background: #0f3b5e;
      color: white;
      box-shadow: 0 10px 18px rgba(15, 59, 94, 0.3);
    }

    .btn-copy:hover {
      background: #1a4b70;
      transform: scale(1.01);
    }

    .btn-download {
      background: #ffffff;
      color: #0f3b5e;
      border: 1.5px solid #0f3b5e;
      font-weight: 600;
    }

    .btn-download:hover {
      background: #f0f6fe;
      border-color: #0a2c44;
    }

    .payment-apps-section {
      margin: 1.5rem 0 0.5rem;
    }

    .payment-apps-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1e3b5a;
      margin-bottom: 0.8rem;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .payment-apps-title::before,
    .payment-apps-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #cbd6e8, transparent);
    }

    .payment-apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .payment-app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 0.5rem;
      border-radius: 1rem;
      background: white;
      border: 1.5px solid #e0e7f0;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      font-size: 0.8rem;
      color: #1e3b5a;
      gap: 0.4rem;
      text-decoration: none;
      box-shadow: 0 3px 8px rgba(0,0,0,0.03);
    }

    .payment-app-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
      border-color: #0f3b5e;
    }

    .payment-app-btn i {
      font-size: 1.8rem;
      margin-bottom: 0.1rem;
    }

    .phonepe-icon { color: #5f259f; }
    .googlepay-icon { color: #4285f4; }
    .paytm-icon { color: #00b9f1; }

    .btn-completed {
      background: linear-gradient(135deg, #1e7b4b 0%, #145c38 100%);
      color: white;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 20px rgba(30, 123, 75, 0.3);
      margin-top: 0.3rem;
    }

    .btn-completed:hover {
      background: linear-gradient(135deg, #218a54 0%, #166b40 100%);
      transform: scale(1.02);
    }

    .btn i {
      font-size: 1.1rem;
    }

    .footer-note {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.7rem;
      color: #7a8b9f;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.3rem;
    }

    hr {
      border: 0.5px solid #dce3f0;
      margin: 1.2rem 0 0.3rem;
    }

    /* small screens: slightly smaller QR */
    @media (max-width: 420px) {
      .gateway-card {
        padding: 1.5rem 1rem;
      }
      .qr-display-image {
        max-width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="gateway-card">
    
    <div class="official-header">
      <div class="brand">
        <div class="shield-icon">
          <i class="fas fa-shield-alt"></i>
        </div>
        <div class="brand-text">
          SwiftPay<span>Gateway • Secure</span>
        </div>
      </div>
      <div class="secure-badge">
        <i class="fas fa-lock"></i> PCI DSS
      </div>
    </div>

    <!-- HEADING -->
    <div class="dynamic-heading" id="editableHeading">
      <h2>Scan & Pay Instantly</h2>
      <div class="sub-msg">
        <i class="fas fa-check-circle" style="color: #1e7b4b;"></i> trusted by 2M+ merchants
      </div>
    </div>

    <!-- QR CODE - MEDIUM SIZE (280px) -->
    <div class="scanner-display">
      <img 
        id="qrImage" 
        class="qr-display-image" 
        src="IMG_20260805_004819.jpg" 
        alt="Payment QR Code"
        onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22280%22%3E%3Crect width=%22280%22 height=%22280%22 fill=%22%23f0f4fd%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%238899aa%22 font-size=%2218%22%3EQR Code%3C/text%3E%3Ctext x=%2250%25%22 y=%2260%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%238899aa%22 font-size=%2213%22%3E(medium)%3C/text%3E%3C/svg%3E';"
      >
      <span class="scanner-label">Scan this QR code to pay</span>
    </div>

    <!-- UPI ID -->
    <div class="upi-id-box">
      <div>
        <div class="upi-label">UPI ID</div>
        <div class="upi-id" id="upiIdText">dpbossheadoffice@ybl</div>
      </div>
      <i class="fas fa-copy" style="color: #0f3b5e; opacity: 0.7;"></i>
    </div>

    <div class="action-buttons">
      <button class="btn btn-copy" id="copyUpiBtn">
        <i class="fas fa-copy"></i> Copy UPI ID
      </button>
      <button class="btn btn-download" id="downloadQrBtn">
        <i class="fas fa-download"></i> Download QR Code
      </button>
    </div>

    <!-- PAYMENT APPS -->
    <div class="payment-apps-section">
      <div class="payment-apps-title">
        <span>Pay with</span>
      </div>
      <div class="payment-apps-grid">
        <button class="payment-app-btn" onclick="openPhonePe()">
          <i class="fas fa-mobile-alt phonepe-icon"></i>
          <span>PhonePe</span>
        </button>
        
        <button class="payment-app-btn" onclick="openGooglePay()">
          <i class="fab fa-google googlepay-icon"></i>
          <span>Google Pay</span>
        </button>
        
        <button class="payment-app-btn" onclick="openPaytm()">
          <i class="fas fa-wallet paytm-icon"></i>
          <span>Paytm</span>
        </button>
      </div>
    </div>

    <!-- COMPLETED BUTTON -->
    <button class="btn btn-completed" onclick="window.location.href='page4.html'">
      <i class="fas fa-check-circle"></i> COMPLETED
    </button>

    <hr>
    <div class="footer-note">
      <i class="fas fa-shield-haltered"></i> 256-bit encrypted • 24/7 support
    </div>
  </div>

  <script>
    (function() {
      // ========== CONFIGURATION ==========
      const QR_IMAGE_PATH = 'IMG_20260805_011432.jpg';   // <-- your QR file
      const UPI_ID = 'dpbossheadoffice@ybl';
      const MERCHANT_NAME = 'SwiftPay Merchant';
      // ====================================

      const qrImage = document.getElementById('qrImage');
      const upiIdElement = document.getElementById('upiIdText');

      if (qrImage) qrImage.src = QR_IMAGE_PATH;
      if (upiIdElement) upiIdElement.textContent = UPI_ID;

      // ========== PAYMENT APP DEEP LINKS ==========
      window.openPhonePe = function() {
        const uri = `phonepe://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=0&cu=INR`;
        openPaymentApp(uri, 'com.phonepe.app', 'https://play.google.com/store/apps/details?id=com.phonepe.app');
      };

      window.openGooglePay = function() {
        const uri = `tez://upi/pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=0&cu=INR`;
        const fallbackUri = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=0&cu=INR`;
        openPaymentApp(uri, 'com.google.android.apps.nbu.paisa.user', 
          'https://play.google.com/store/apps/details?id=com.google.android.apps.nbu.paisa.user',
          fallbackUri);
      };

      window.openPaytm = function() {
        const uri = `paytmmp://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=0&cu=INR`;
        openPaymentApp(uri, 'net.one97.paytm', 'https://play.google.com/store/apps/details?id=net.one97.paytm');
      };

      function openPaymentApp(uri, packageName, storeUrl, fallbackUri = null) {
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        if (!isMobile) {
          window.open(storeUrl, '_blank');
          return;
        }

        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = uri;
        document.body.appendChild(iframe);
        
        setTimeout(() => {
          document.body.removeChild(iframe);
          if (fallbackUri) {
            window.location.href = fallbackUri;
          } else {
            window.location.href = storeUrl;
          }
        }, 2000);
        
        setTimeout(() => {
          window.location.href = uri;
        }, 100);
      }

      // ========== COPY UPI ID ==========
      document.getElementById('copyUpiBtn').addEventListener('click', function() {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(UPI_ID).then(() => {
            showFeedback(this, '✓ Copied!');
          }).catch(() => {
            fallbackCopy(UPI_ID, this);
          });
        } else {
          fallbackCopy(UPI_ID, this);
        }
      });

      function fallbackCopy(text, button) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showFeedback(button, '✓ Copied!');
        } catch (err) {
          alert('Copy failed. UPI ID: ' + text);
        }
        document.body.removeChild(textArea);
      }

      function showFeedback(button, message) {
        const original = button.innerHTML;
        button.innerHTML = `<i class="fas fa-check"></i> ${message}`;
        button.disabled = true;
        setTimeout(() => {
          button.innerHTML = original;
          button.disabled = false;
        }, 2000);
      }

      // ========== DOWNLOAD QR CODE ==========
      document.getElementById('downloadQrBtn').addEventListener('click', function() {
        const img = document.getElementById('qrImage');
        
        fetch(img.src)
          .then(response => response.blob())
          .then(blob => {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'SwiftPay_QR_Code.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showFeedback(this, '✓ Downloaded!');
          })
          .catch(() => {
            // fallback: open in new tab
            window.open(img.src, '_blank');
            showFeedback(this, 'Opened in new tab');
          });
      });

      // ========== GLOBAL CUSTOMIZATION HELPER ==========
      window.customizeHeading = function(mainTitle, subMessage) {
        document.querySelector('#editableHeading h2').textContent = mainTitle;
        document.querySelector('#editableHeading .sub-msg').innerHTML = 
          `<i class="fas fa-check-circle" style="color: #1e7b4b;"></i> ${subMessage}`;
      };

      console.log('✅ SwiftPay Gateway Ready (medium QR)');
      console.log('📁 QR Image Path:', QR_IMAGE_PATH);
      console.log('💳 UPI ID:', UPI_ID);
    })();
  </script>
</body>
</html>
